name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check src/core/optiscaler.js
          node --check scripts/test-presr-download.js

      - name: Unit and Pre-SR UI wiring tests
        run: npm test

      - name: Verify pinned Pre-SR backend
        run: node scripts/test-presr-download.js

      # The inherited full Electron screenshot harness currently has a stale
      # assertion upstream: it expects 8 API options while rendering-api.js has
      # Auto + 8 manual choices (9 total, after DirectDraw was added). Keep our
      # Pre-SR UI covered by unit/source wiring tests until that upstream harness
      # is corrected rather than making a known unrelated failure gate this fork.

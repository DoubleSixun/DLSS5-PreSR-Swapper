name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check presr-main.js
          node --check preload.js
          node --check src/core/presr-bootstrap.js
          node --check src/core/optiscaler.js
          node --check standalone/main.js
          node --check standalone/preload.js
          node --check standalone/renderer/app.js
          node --check standalone/core/ini.js
          node --check standalone/core/download.js
          node --check standalone/core/file-state.js
          node --check standalone/core/game-scan.js
          node --check standalone/core/runtime.js
          node --check standalone/core/optiscaler.js
          node --check standalone/core/derived/pe.js
          node --check scripts/test-presr-download.js

      - name: Unit and standalone wiring tests
        run: npm test

      - name: Verify pinned Pre-SR backend
        run: node scripts/test-presr-download.js

  build-standalone-preview:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone runtime-free portable preview
        run: npm run build:standalone:portable

      - name: Upload standalone Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Neural-Rendering-Manager-Windows-preview
          path: dist-standalone/*portable.exe
          if-no-files-found: error
          retention-days: 14
